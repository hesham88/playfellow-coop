name: Bug report
description: Something does not work as described
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please do not paste API keys, personal data or private screenshots. Security problems go through the Security tab, not here."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The command you ran, the game or test scene, the language (English or Arabic).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version (commit or tag) and Windows version
  - type: textarea
    id: logs
    attributes:
      label: Output or logs (remove anything private)
      render: text
