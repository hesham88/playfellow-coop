name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No secrets are used here, and none are exposed to pull requests from forks.
permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the optional Rust fast path (the tests then require it to load)
        shell: pwsh
        run: ./rust/build.ps1
      - name: Install the engine from the pinned tag, then this repository
        shell: bash
        run: |
          git clone --depth 1 --branch pre-hackathon https://github.com/hesham88/playfellow.git engine
          python -m pip install -e engine
          python -m pip install -e . pytest
      - name: Test (warnings are errors; the Rust DLL and Node are required here, never silently skipped)
        env:
          PF_REQUIRE_NATIVE: "1"
          PF_REQUIRE_NODE: "1"
          PLAYFELLOW_ENGINE: ${{ github.workspace }}/engine/software
        run: python -m pytest -q -W error

  adk:
    # Optional: Google ADK in an environment of its own (google-adk 2.13.0 needs websockets below 16, this package needs 16 or later), made from the lock by
    # tools/adk_env.py, which also checks the pinned version; only the ADK tests run here. The job above never installs ADK.
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Clone the engine at the pinned tag (the tests read it from the clone; it is not installed here)
        shell: bash
        run: git clone --depth 1 --branch pre-hackathon https://github.com/hesham88/playfellow.git engine
      - name: Make the ADK environment from the lock, outside the repository, and check it
        shell: pwsh
        run: python tools/adk_env.py --venv "$env:RUNNER_TEMP\adk-venv" --from-lock
      - name: Test (only tests/test_adk_*.py; warnings are errors)
        shell: pwsh
        env:
          PLAYFELLOW_ENGINE: ${{ github.workspace }}/engine/software
          SDL_VIDEODRIVER: dummy
        run: |
          & "$env:RUNNER_TEMP\adk-venv\Scripts\python.exe" -m pytest -q -W error (Get-ChildItem tests -Filter "test_adk_*.py").FullName
