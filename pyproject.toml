[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-playfellow"
version = "0.1.0.dev0"
description = "Event work for the PlayFellow engine: a Muse brain with a daily spending cap"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "certifi", "Pillow>=10.1"]
# The engine itself is installed first, from a clone of the tag (see the README); it is not a dependency pulled from here.

[tool.setuptools]
packages = ["meta_playfellow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
