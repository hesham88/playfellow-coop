[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "playfellow-coop"
version = "0.1.0.dev0"
description = "An accessibility co-op for gamers whose hands cannot keep up: voice commands in English or Arabic, a one-key hand-over, a Muse brain, SAM marks, an optional Rust fast path. Event work for the PlayFellow engine."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "certifi", "Pillow>=10.1", "websockets>=16,<18", "sounddevice>=0.4", "pynput>=1.7", "keyring>=24"]
# The engine itself is installed first, from a clone of the tag (bootstrap.ps1 or the README); it is not a dependency pulled from here.

[project.optional-dependencies]
# SuperTuxKart and Endless Sky packs (playfellow_coop.games)
stk = ["numpy", "opencv-python-headless", "mss", "PySide6"]
# the in-game widget (--overlay): a no-focus, always-on-top Qt bar docked at the top centre of the game
overlay = ["PySide6"]
# tools/assemble_video.py: ffmpeg from PATH, or this package's bundled copy (CI runners have no ffmpeg on PATH)
video = ["imageio-ffmpeg>=0.5"]
# everything a player needs: the widget, the game packs and the video tool
all = ["numpy", "opencv-python-headless", "mss", "PySide6", "imageio-ffmpeg>=0.5"]

[tool.setuptools]
packages = ["playfellow_coop", "playfellow_coop.overlay", "playfellow_coop.games", "playfellow_coop.games.stk", "playfellow_coop.games.platform", "playfellow_coop.games.endless_sky", "playfellow_coop.games.rayman", "playfellow_coop.skills", "playfellow_coop.harness", "playfellow_coop.universal", "playfellow_coop.skillsmith", "playfellow_coop.gym", "playfellow_coop.evalkit", "playfellow_coop.adk_app", "playfellow_coop.adk_app.arena_eval", "playfellow_coop.serve", "playfellow_coop.agent", "train"]

[tool.setuptools.package-data]
# the optional Rust fast path: built by rust/build.ps1 into this folder; without it the Python twin runs
playfellow_coop = ["games/stk/research_skills.json", "games/platform/research_skills.json", "games/*/skills.json", "games/*/SKILLS.md", "overlay/avatar3d.html", "_native/*.dll", "universal/states/*.json", "universal/states/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
